# zx-agent im becomes the container's main process. With a shared process namespace the
# pause container is PID 1: it reaps the processes commands leave behind, and /proc/1/environ
# holds none of this container's variables: the keys are only in zx-agent's own environment,
# where commands running as the same user can read them and redaction replaces their values
# in tool output. kubectl exec still starts chat or run beside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zx-agent
spec:
  template:
    spec:
      shareProcessNamespace: true
      containers:
        - name: zx-agent
          command:
            - zx-agent
            - im
            - --config
            - /etc/zx-agent-im/im.toml
            - --profile
            - /usr/local/share/zx-agent/profiles/kubernetes.toml
          env:
            # Each platform reads only its own keys; the Secret holds the ones in use.
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zx-agent-im
                  key: slack-app-token
                  optional: true
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zx-agent-im
                  key: slack-bot-token
                  optional: true
            # ⚑ D:5/CHINA FLAG: Feishu (Subject to Legal/Export Compliance approval).
            - name: FEISHU_APP_ID
              valueFrom:
                secretKeyRef:
                  name: zx-agent-im
                  key: feishu-app-id
                  optional: true
            - name: FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: zx-agent-im
                  key: feishu-app-secret
                  optional: true
          volumeMounts:
            # Not /etc/zx-agent: the multicluster component mounts its kubeconfig there.
            - name: im-config
              mountPath: /etc/zx-agent-im
              readOnly: true
      volumes:
        - name: im-config
          configMap:
            name: zx-agent-im-config

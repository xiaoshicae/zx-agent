[workspace]
members = [
  "crates/zx-ai",
  "crates/zx-ai-openai",
  "crates/zx-core",
  "crates/zx-tools",
  "crates/zx-im",
  "crates/zx-im-slack",
  "crates/zx-im-feishu",
]
# Commands run at the root (build, test, clippy, doc) cover every crate, not only zx-agent.
default-members = [
  ".",
  "crates/zx-ai",
  "crates/zx-ai-openai",
  "crates/zx-core",
  "crates/zx-tools",
  "crates/zx-im",
  "crates/zx-im-slack",
  "crates/zx-im-feishu",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
zx-ai = { path = "crates/zx-ai" }
zx-ai-openai = { path = "crates/zx-ai-openai" }
zx-core = { path = "crates/zx-core" }
zx-im = { path = "crates/zx-im" }
zx-im-feishu = { path = "crates/zx-im-feishu" }
zx-im-slack = { path = "crates/zx-im-slack" }
zx-tools = { path = "crates/zx-tools" }

agent-client-protocol = { version = "5.0", default-features = false, features = ["stdio"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
libc = "0.2"
jsonschema = { version = "0.33", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal", "io-util", "fs", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }

# Lints beyond clippy's defaults; clippy runs with `-D warnings`, so each is an error. The
# thresholds are in clippy.toml; .claude/rules/09-size-and-duplication.md says what to do
# with a hit.
[workspace.lints.rust]
# `pub` only where something outside the crate can reach it.
unreachable_pub = "warn"

[workspace.lints.clippy]
# Size.
too_many_lines = "warn"
cognitive_complexity = "warn"
# Numbers: no silent truncation, wrap or sign change.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
# Readability.
enum_glob_use = "warn"
wildcard_imports = "warn"
match_same_arms = "warn"
uninlined_format_args = "warn"
struct_excessive_bools = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
items_after_statements = "warn"
map_unwrap_or = "warn"
unreadable_literal = "warn"
unnested_or_patterns = "warn"
manual_let_else = "warn"
needless_continue = "warn"
ignored_unit_patterns = "warn"
# Layout: one module file style, the one the Rust Reference encourages. The exception is
# `tests/common/mod.rs`, which Cargo needs under that name.
mod_module_files = "warn"

[package]
name = "zx-agent"
description = "Minimal general-purpose agent kernel for interactive, unattended, and embedded use, modeled on pi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "zx_agent"
path = "src/lib.rs"

[[bin]]
name = "zx-agent"
path = "src/main.rs"

[dependencies]
zx-ai.workspace = true
zx-ai-openai.workspace = true
zx-core.workspace = true
zx-im.workspace = true
zx-im-feishu.workspace = true
zx-im-slack.workspace = true
zx-tools.workspace = true

agent-client-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# The fake chat platforms of the integration tests (tests/common/) speak WebSocket.
tokio-tungstenite.workspace = true

[target."cfg(unix)".dependencies]
libc.workspace = true

name: Release

on:
  push:
    tags: ["v*"]
  # Dispatch against a tag, e.g. gh workflow run release.yml --ref v0.1.0.
  # Keeping the workflow ref and source ref identical also binds provenance to the tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate release tag
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate tag and package version
        id: release
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib

          if os.environ["GITHUB_REF_TYPE"] != "tag":
              raise SystemExit("Select a version tag: gh workflow run release.yml --ref vX.Y.Z")
          tag = os.environ["GITHUB_REF_NAME"]
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} must match Cargo.toml version v{version}")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nsha={sha}\n")
          PY

  build:
    name: Package (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install release toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --target "$TARGET"
      - name: Test release source
        run: cargo +1.88.0 test --locked
      - name: Build release binary
        run: cargo +1.88.0 build --locked --release --target "$TARGET"
      - name: Package binary
        run: |
          package_dir="$(mktemp -d)"
          trap 'rm -rf -- "$package_dir"' EXIT
          binary="target/$TARGET/release/zx-agent"
          test "$("$binary" --version)" = "zx-agent ${RELEASE_TAG#v}"
          install -m 755 "$binary" "$package_dir/zx-agent"
          cp LICENSE README.md "$package_dir/"
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/zx-agent-$RELEASE_TAG-$TARGET.tar.gz" \
            -C "$package_dir" zx-agent LICENSE README.md
      - name: Attest package provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Include attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/zx-agent-$RELEASE_TAG-$TARGET.tar.gz.sigstore.json"
      - name: Upload package and bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  draft:
    name: Assemble release draft
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Verify packages and create checksums
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            archive="dist/zx-agent-$RELEASE_TAG-$target.tar.gz"
            test -s "$archive"
            test -s "$archive.sigstore.json"
            gh attestation verify "$archive" --repo "$GH_REPO" \
              --bundle "$archive.sigstore.json" --source-digest "$RELEASE_SHA" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          done
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Create or update release draft
        run: bash .github/scripts/draft-release.sh

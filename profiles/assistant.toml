name = "assistant"
instructions = "assistant.md"
tools = ["bash", "read_file", "read_skill", "read_output"]
execution = "local"

[rules]
askTools = ["bash"]
# Read-only commands that run without asking: none of them can run another program or
# write a file. awk, sed, sort, uniq, find, xargs, tee and curl are left out for that
# reason. Commands with quotes, $, other shell syntax, the word "secret", a URL, a
# connection option (such as kubectl --server) or a kubectl option outside a read-only set
# (such as --raw or --profile-output) still ask; see README, "安全模型".
autoApprove = [
  "kubectl get",
  "kubectl describe",
  "kubectl logs",
  "kubectl top",
  "kubectl events",
  "kubectl explain",
  "kubectl api-resources",
  "kubectl version",
  "kubectl config get-contexts",
  "kubectl config current-context",
  "grep",
  "head",
  "tail",
  "wc",
  "jq",
]

[limits]
maxTurns = "unlimited"
timeoutSecs = 0

[extensions]
redaction = true
continueOnLength = 0

[context]
discover = true

[compaction]
triggerBytes = 262144
keepRecentBytes = 65536
maxSummaryTokens = 2048
timeoutSecs = 120

[toolOutput]
thresholdBytes = 8192
maxFileBytes = 1048576

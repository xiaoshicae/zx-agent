# The control arm of the sample behaviour evals (`tests/common/evals.rs`): the unattended
# profile with the file tools, and no project notes.
name = "eval-control"
extends = "unattended"
tools = ["read_file", "edit_file", "write_file"]

[limits]
maxModelRequests = 6
timeoutSecs = 120

[context]
discover = false

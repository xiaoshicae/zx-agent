[package]
name = "zx-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Minimal general-purpose agent kernel for interactive, unattended, and embedded use, modeled on pi"
license = "MIT"
publish = false

[lib]
name = "zx_agent"
path = "src/lib.rs"

[[bin]]
name = "zx-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal", "io-util", "fs", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"

# The steps, and the objects to create before applying: README.md, "部署".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zx-agent
resources:
  - serviceaccounts.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - cronjob.yaml
# Writes for the resident Pod's account are a separate step, granted per namespace:
# operator.yaml (README.md, "权限").
# On every object and Pod, to select them in a NetworkPolicy or a log query. Not on selectors,
# which cannot change once the Deployment exists.
labels:
  - pairs:
      app.kubernetes.io/part-of: zx-agent
    includeTemplates: true
# Optional components (README.md, "多集群" and "IM 服务"): create their ConfigMap and Secret
# first, then uncomment `components:` and the ones wanted.
# components:
#   - multicluster
#   - im
# Mounted at /data/.zx-agent/agents, the agents directory of the zx-agent home (HOME is /data),
# where they replace the built-in agents of the same names.
configMapGenerator:
  - name: zx-agent-agents
    files:
      - agents/assistant.md
      - agents/unattended.md
images:
  # The image built and pushed in README.md, "部署", step 1.
  - name: zx-agent
    newName: zx-agent
    newTag: latest

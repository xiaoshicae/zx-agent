name = "code-review"
extends = "assistant"
instructions = "review.md"
tools = ["read_file", "read_skill"]

[rules]
denyTools = ["bash"]

[limits]
maxModelRequests = 12
timeoutSecs = 300

[extensions]
continueOnLength = 0

[context]
discover = true
files = ["review-context.md"]

[[skills]]
name = "rust-review"
description = "Review Rust ownership, async cancellation, errors and test coverage."
path = "skills/rust-review/SKILL.md"

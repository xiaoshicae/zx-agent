name = "troubleshoot"
instructions = "troubleshoot.md"
# read_output is opt-in here: unattended runs keep tool results inline, as before P5,
# and never write into a working directory that may be read-only.
tools = ["bash", "read_file", "read_skill"]
execution = "local"

[limits]
maxTurns = 30
timeoutSecs = 900

[extensions]
redaction = true
continueOnLength = 1

[context]
# Unattended runs do not read repository instructions unless asked explicitly.
discover = false

[compaction]
triggerBytes = 0
keepRecentBytes = 65536
maxSummaryTokens = 2048
timeoutSecs = 120

[toolOutput]
thresholdBytes = 8192
maxFileBytes = 1048576

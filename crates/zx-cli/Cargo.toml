[package]
name = "zx-cli"
description = "The zx-agent command line: run, chat, acp, im and sessions, with config.toml, agent files and trace export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "zx_cli"
path = "src/lib.rs"

# The program keeps the project's name. It is not documented: its pages would take the place
# of the library's of the same name (`zx_agent`, the root package).
[[bin]]
name = "zx-agent"
path = "src/main.rs"
doc = false

[dependencies]
zx-agent.workspace = true
zx-im.workspace = true
zx-im-feishu.workspace = true
zx-im-slack.workspace = true

agent-client-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# The fake chat platforms of the integration tests (tests/common/ of the repository root)
# speak WebSocket.
tokio-tungstenite.workspace = true

[target."cfg(unix)".dependencies]
libc.workspace = true

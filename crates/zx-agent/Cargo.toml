# The library: the kernel and what ships with it, under one name. The program `zx-agent` is
# the package crates/zx-cli.
[package]
name = "zx-agent"
description = "Minimal general-purpose agent kernel for interactive, unattended, and embedded use, modeled on pi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The scripted provider `ai::faux::FauxProvider`, for a host's tests: the feature
# `testing` of zx-ai.
testing = ["zx-ai/testing"]

[dependencies]
zx-ai.workspace = true
zx-ai-anthropic.workspace = true
zx-ai-openai.workspace = true
zx-builtin.workspace = true
zx-core.workspace = true

# For tests/, the integration tests of the workspace's libraries, and for examples/.
[dev-dependencies]
# The tests script the model with `ai::faux::FauxProvider`.
zx-ai = { workspace = true, features = ["testing"] }
# The helpers the integration tests of the workspace share.
zx-testing.workspace = true

anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
uuid.workspace = true

# zx-im becomes the container's main process. With a shared process namespace the pause
# container is PID 1 and reaps the processes that commands leave behind.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zx-agent
spec:
  template:
    spec:
      shareProcessNamespace: true
      containers:
        - name: zx-agent
          command:
            - zx-im
            - --config
            - /etc/zx-agent-im/im.toml
            # The assistant agent bounds neither requests nor time; without these, a run that
            # does not converge holds a run slot (limits.maxRunning) for good.
            - --max-model-requests
            - "100"
            - --timeout-secs
            - "3600"
          env:
            # Each platform reads only its own keys; the Secret holds the ones in use.
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zx-agent-im
                  key: slack-app-token
                  optional: true
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zx-agent-im
                  key: slack-bot-token
                  optional: true
            # ⚑ D:5/CHINA FLAG: Feishu (Subject to Legal/Export Compliance approval).
            - name: FEISHU_APP_ID
              valueFrom:
                secretKeyRef:
                  name: zx-agent-im
                  key: feishu-app-id
                  optional: true
            - name: FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: zx-agent-im
                  key: feishu-app-secret
                  optional: true
          volumeMounts:
            # Not /etc/zx-agent: the multicluster component mounts its kubeconfig there.
            - name: im-config
              mountPath: /etc/zx-agent-im
              readOnly: true
      volumes:
        - name: im-config
          configMap:
            name: zx-agent-im-config

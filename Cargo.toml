# The root is a workspace and no package: every crate is under crates/, so commands run at the
# root (build, test, clippy, doc) cover them all.
[workspace]
members = ["crates/*"]
# What edition 2024 implies for a package; a virtual manifest has no edition and must say it.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
zx-agent = { path = "crates/zx-agent" }
zx-ai = { path = "crates/zx-ai" }
zx-ai-anthropic = { path = "crates/zx-ai-anthropic" }
zx-ai-http = { path = "crates/zx-ai-http" }
zx-ai-openai = { path = "crates/zx-ai-openai" }
zx-app = { path = "crates/zx-app" }
zx-builtin = { path = "crates/zx-builtin" }
zx-core = { path = "crates/zx-core" }
zx-testing = { path = "crates/zx-testing" }
zx-util = { path = "crates/zx-util" }

agent-client-protocol = { version = "5.0", default-features = false, features = ["stdio"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
jsonschema = { version = "0.33", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1", features = ["derive"] }
# JSON objects keep their keys in the order written, in the whole build and in a crate built
# alone; tests that compare JSON text rely on it.
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
# tokio has no default features; each crate turns on those its code and its tests use.
tokio = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }

# Lints beyond clippy's defaults; clippy runs with `-D warnings`, so each is an error. The
# thresholds are in clippy.toml; .claude/rules/08-size-and-duplication.md says what to do
# with a hit.
[workspace.lints.rust]
# `pub` only where something outside the crate can reach it.
unreachable_pub = "warn"

[workspace.lints.clippy]
# Size.
too_many_lines = "warn"
cognitive_complexity = "warn"
# Numbers: no silent truncation, wrap or sign change.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
# Readability.
enum_glob_use = "warn"
wildcard_imports = "warn"
match_same_arms = "warn"
uninlined_format_args = "warn"
struct_excessive_bools = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
items_after_statements = "warn"
map_unwrap_or = "warn"
unreadable_literal = "warn"
unnested_or_patterns = "warn"
manual_let_else = "warn"
needless_continue = "warn"
ignored_unit_patterns = "warn"
# Layout: one module file style, the one the Rust Reference encourages. The exception is
# `tests/common/mod.rs` of crates/zx-cli and crates/zx-im, which Cargo needs under that name.
mod_module_files = "warn"

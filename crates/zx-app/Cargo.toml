[package]
name = "zx-app"
description = "The application layer of zx-agent: config.toml, agent files, agents assembled from them, trace export and shutdown, for the programs built on it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zx-agent.workspace = true
zx-util.workspace = true

anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync"] }
tokio-util.workspace = true
toml.workspace = true

[dev-dependencies]
# The tests script the model with `ai::faux::FauxProvider`.
zx-agent = { workspace = true, features = ["testing"] }
zx-testing.workspace = true

opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true

# A second signal ends the process by that signal (`shutdown`).
[target."cfg(unix)".dependencies]
libc.workspace = true

# The treatment arm of the sample behaviour evals (`tests/common/evals.rs`): the control
# plus the project notes in `hints.md`. The two arms differ in nothing else.
name = "eval-treatment"
extends = "unattended"
tools = ["read_file", "edit_file", "write_file"]

[limits]
maxModelRequests = 6
timeoutSecs = 120

[context]
discover = false
files = ["hints.md"]

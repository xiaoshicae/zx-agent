[package]
name = "zx-ai"
description = "Model layer of zx-agent: message types, the streaming event protocol and the provider contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The scripted provider `faux::FauxProvider`, for the tests of the crates built on this one;
# off in every other build. It streams its answers from Tokio tasks.
testing = ["dep:tokio"]

[dependencies]
zx-util.workspace = true

async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"], optional = true }
tokio-util.workspace = true

[dev-dependencies]
# The scripted provider's own tests run on Tokio's test runtime.
tokio = { workspace = true, features = ["macros", "rt"] }

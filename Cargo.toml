[package]
name = "zx-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal agent kernel for unattended automation, modeled on the pi agent loop"
license = "MIT"
publish = false

[lib]
name = "zx_agent"
path = "src/lib.rs"

[[bin]]
name = "zx-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal", "io-util", "fs", "net"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"

name = "assistant"
instructions = "assistant.md"
tools = ["bash", "read_file", "read_skill", "read_output"]
execution = "local"

[rules]
askTools = ["bash"]

[limits]
maxTurns = "unlimited"
timeoutSecs = 0

[extensions]
redaction = true
continueOnLength = 0

[context]
discover = true

[compaction]
triggerBytes = 262144
keepRecentBytes = 65536
maxSummaryTokens = 2048
timeoutSecs = 120

[toolOutput]
thresholdBytes = 8192
maxFileBytes = 1048576

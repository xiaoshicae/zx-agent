# Scheduled inspection: an unattended run with the read-only account. The answer is written
# to the Pod log (kubectl logs); the exit code tells the result (docs/REFERENCE.md, "run 退出码").
# Each run also keeps its session file, the audit record of every request and command, on
# the volume zx-agent-inspect-sessions as sessions/<Pod name>.jsonl. Before each run, session
# files older than 30 days are removed: a full volume would fail every run, since a run stops
# when it cannot write its session.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zx-agent-inspect
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  # A day of hourly reports stays readable with kubectl logs; ttlSecondsAfterFinished below
  # removes each Job after the same day.
  successfulJobsHistoryLimit: 24
  failedJobsHistoryLimit: 24
  jobTemplate:
    spec:
      backoffLimit: 0
      # Above the run's own 15-minute limit (the deployment's unattended agent, from the built-in).
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: zx-agent-inspect
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            # The session volume is writable by this group.
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The directory does not exist before the first run. Change the 30 after -mtime to
            # keep the audit records for another number of days.
            - name: prune-sessions
              image: zx-agent
              command:
                - sh
                - -c
                - "[ ! -d /data/sessions ] || find /data/sessions -maxdepth 1 -type f -name '*.jsonl' -mtime +30 -delete"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: sessions
                  mountPath: /data
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 64Mi
          containers:
            - name: inspect
              image: zx-agent
              # zx-agent itself is PID 1 and the only process holding the API key; commands run
              # as the same user and can read it from /proc, and redaction replaces its value in
              # tool output (docs/SECURITY.md).
              # This deployment's unattended agent (agents/unattended.md, mounted from the
              # ConfigMap zx-agent-agents) gives the report its fixed sections; without it, run
              # uses the neutral built-in unattended agent.
              # $(POD_NAME) is expanded by Kubernetes, without a shell: a file per run.
              command:
                - zx-agent
                - run
                - --session
                - /data/sessions/$(POD_NAME).jsonl
              args:
                - "检查所有命名空间中未就绪的 Pod 和最近一小时的 Warning 事件，列出问题和可能的原因。只读，不做任何修改。"
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                # kubectl reads this account's token, and so can commands: redact its value.
                - name: ZX_SECRET_FILES
                  value: /var/run/secrets/kubernetes.io/serviceaccount/token
                - name: ZX_MODEL
                  valueFrom:
                    configMapKeyRef:
                      name: zx-agent-model
                      key: model
                - name: ZX_BASE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: zx-agent-model
                      key: base-url
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: zx-agent-model
                      key: api-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: sessions
                  mountPath: /data
                - name: agents
                  mountPath: /data/.zx-agent/agents
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
          volumes:
            - name: sessions
              persistentVolumeClaim:
                claimName: zx-agent-inspect-sessions
            - name: agents
              configMap:
                name: zx-agent-agents
            # Beyond this the kubelet evicts the Pod, instead of commands filling the node's disk.
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
